################################
# HYPRLAND 0.56.2 — migrado do niri
# envs ficam em ~/.config/environment.d/10-session.conf (sessão systemd)
################################

source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/autostart.conf

$mod = SUPER
$rofi_theme = /home/cesar/.config/rofi/themes/pastel-candy.rasi

################################
# MONITOR
################################

# vrr 3 = VRR só em fullscreen com conteúdo video/game (niri: on-demand)
monitor = DP-1, preferred, auto, 1, vrr, 3

################################
# GENERAL + APPEARANCE
################################

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 4
    col.active_border = rgb(2a9ff5)
    col.inactive_border = rgb(505050)
    layout = dwindle
}

cursor {
    no_hardware_cursors = true
}

decoration {
    rounding = 12
    active_opacity = 0.99
    inactive_opacity = 0.99
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # transparente para o swaybg (systemd) aparecer por trás
    background_color = rgba(0, 0, 0, 0)
    middle_click_paste = false
}

render {
    direct_scanout = 2
}

################################
# INPUT
################################

input {
    kb_layout = br
    kb_variant = abnt2
    kb_options = caps:none
    repeat_delay = 600
    repeat_rate = 25
    follow_mouse = 1
    accel_profile = flat
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

################################
# ANIMATIONS
################################

animations {
    enabled = true
    animation = windows, 1, 5, default
}

################################
# MOUSE
################################

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

################################
# WINDOW MANAGEMENT
################################

bind = $mod, SPACE, togglefloating
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0          # niri fullscreen-window
bind = $mod, R, layoutmsg, togglesplit # ~ niri switch-preset-column-width
bind = $mod, M, fullscreen, 1          # ~ niri maximize-column
bind = $mod, C, layoutmsg, splitratio 0.5  # ~ niri center-column

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

################################
# LAUNCHERS + APPS
################################

bind = $mod, T, exec, ghostty
bind = $mod, RETURN, exec, rofi -show drun -theme $rofi_theme
bind = $mod, B, exec, dolphin
bind = $mod ALT, L, exec, hyprlock

################################
# MEDIA KEYS
################################

bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

################################
# SCREENSHOTS
################################

bind = , Print, exec, /home/cesar/.local/bin/screenshot
bind = $mod SHIFT, S, exec, /home/cesar/.local/bin/screenshot

################################
# WORKSPACES
################################

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# ciclo de workspaces (niri focus-workspace-up/down)
bind = $mod, U, workspace, +1
bind = $mod, I, workspace, -1

# alt-tab: próximo/anterior workspace ocupado
bind = ALT, TAB, workspace, e+1
bind = ALT SHIFT, TAB, workspace, e-1

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

################################
# SESSION
################################

bind = $mod SHIFT, E, exit             # encerra a sessão (uwsm derruba tudo)
