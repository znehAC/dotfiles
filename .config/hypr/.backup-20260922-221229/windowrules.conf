# ============================================================
# WINDOW RULES — traduzidas do niri
# Sintaxe 0.56: windowrule = <efeito>, match:<campo> <regex>
# ATENÇÃO: o motor de regex é RE2 (sem lookahead/backreference).
# ============================================================

# --- Diálogos flutuantes (por título) ---
windowrule = float on, match:title ^(Open File|Save As|Enter name of file to save to|File Upload|Picture-in-Picture|Sign in|Authorize access|Authenticate)$

# --- Utilitários flutuantes ---
windowrule = float on, match:class ^(imv)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 900 650, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(pavucontrol|qpwgraph|helvum|blueman-manager|nm-connection-editor)$
windowrule = size 800 600, match:class ^(pavucontrol|qpwgraph|helvum|blueman-manager|nm-connection-editor)$
windowrule = float on, match:class ^(org\.kde\.dolphin|dolphin)$
windowrule = float on, match:class ^(Rofi|rofi)$
windowrule = border_size 0, match:class ^(Rofi|rofi)$
windowrule = float on, match:class .*polkit.*
windowrule = float on, match:class ^(crx_.*|chrome-extension.*)$
windowrule = float on, match:title ^(Extension: \(.*\))$

# --- ghostty ---
# o btop sobe com class própria (com.mitchellh.ghostty.btop), então não casa aqui
windowrule = float on, match:class ^(com\.mitchellh\.ghostty)$
windowrule = size 1150 800, match:class ^(com\.mitchellh\.ghostty)$
windowrule = workspace 2 silent, match:class ^(com\.mitchellh\.ghostty\.btop)$
windowrule = maximize on, match:class ^(com\.mitchellh\.ghostty\.btop)$

# --- Apps -> workspaces (silent: Hyprland não tem regra de foco) ---
windowrule = workspace 1 silent, match:class ^(zen)$
windowrule = maximize on, match:class ^(zen)$
windowrule = no_vrr on, match:class ^(zen)$          # niri: variable-refresh-rate false
windowrule = workspace 2 silent, match:class ^(spotify|Spotify)$
windowrule = maximize on, match:class ^(spotify|Spotify)$
windowrule = workspace 4 silent, match:class ^(vesktop|Vesktop)$
windowrule = maximize on, match:class ^(vesktop|Vesktop)$
windowrule = workspace 9 silent, match:class ^(slack|Slack)$
windowrule = maximize on, match:class ^(slack|Slack)$

# --- steam/heroic/lutris -> ws5 (sem maximize: no dwindle já preenchem sozinhos) ---
windowrule = workspace 5 silent, match:class ^(steam|Steam|heroic|heroichl|lutris|Lutris)$
windowrule = float on, match:title ^(Friends List|.* - Chat|Steam - News|Settings|.* - Properties)$

# --- Steam ghost windows (janelas invisíveis que roubam foco) ---
windowrule = stay_focused on, match:class ^(steam|Steam)$, match:title ^$
windowrule = min_size 1 1, match:class ^(steam|Steam)$, match:title ^$
windowrule = float on, match:class ^(steam|Steam)$, match:title ^$

# --- Jogos: fullscreen + content game ---
windowrule = fullscreen on, match:class ^(steam_app_\d+|gamescope|cs2|dota2|Cyberpunk2077|bg3\.exe|bg3_dx11\.exe|acs\.exe|assettocorsa\.exe|heroic|lutris-wrapper)$
windowrule = content game, match:class ^(steam_app_\d+|gamescope|cs2|dota2|Cyberpunk2077|bg3\.exe|bg3_dx11\.exe|acs\.exe|assettocorsa\.exe|heroic|lutris-wrapper)$
windowrule = no_vrr on, match:class ^(steam_app_4698190)$   # niri: exceção sem VRR
windowrule = content game, match:title ^(Ara|Turi)$
windowrule = float on, match:title ^(Ara|Turi)$
windowrule = size 1280 720, match:title ^(Ara|Turi)$

# --- exiled-exchange-2 ---
windowrule = float on, match:class ^(exiled-exchange-2)$
windowrule = no_initial_focus on, match:class ^(exiled-exchange-2)$
windowrule = maximize on, match:class ^(exiled-exchange-2)$
windowrule = border_size 0, match:class ^(exiled-exchange-2)$
windowrule = opacity 0.95 0.95, match:class ^(exiled-exchange-2)$
