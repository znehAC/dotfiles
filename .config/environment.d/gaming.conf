# NVIDIA shader cache: 12 GB, do not prune it (CachyOS gaming guide)
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# WiVRn: lets Steam Linux Runtime (pressure-vessel) containers import the host OpenXR runtime.
# WiVRn's own server/dashboard log says to set this for Steam games. Without it (and without
# WiVRn being connected) a Steam VR game fails with XR_ERROR_RUNTIME_UNAVAILABLE.
PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES=1
