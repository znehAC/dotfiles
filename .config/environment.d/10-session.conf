# ============================================================================
# Ambiente da sessão do usuário — lido pelo systemd --user no login.
# Fonte única: Hyprland, serviços systemd e apps do WM herdam daqui.
# Formato environment.d: KEY=VALUE, sem export/aspas, $VAR expande.
# ============================================================================

# --- PATH & toolchains -------------------------------------------------------
CUDA_PATH=/opt/cuda
NVCC_CCBIN=/usr/bin/g++-15
LADSPA_PATH=/home/cesar/.local/lib/ladspa:/usr/lib/ladspa
PATH=/opt/shader-slang-bin/bin:$HOME/.local/bin:$HOME/bin:$HOME/.npm-global/bin:/opt/cuda/bin:/opt/cuda/nsight_compute:/opt/cuda/nsight_systems/bin:$HOME/.spicetify:/usr/local/sbin:/usr/local/bin:/usr/bin:/var/lib/flatpak/exports/bin:/usr/lib/jvm/default/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:${PATH}

# --- Google Cloud CLI --------------------------------------------------------
CLOUDSDK_ROOT_DIR=/opt/google-cloud-cli
GOOGLE_CLOUD_SDK_HOME=/opt/google-cloud-cli

# --- NVIDIA / hardware -------------------------------------------------------
GBM_BACKEND=nvidia-drm
__GLX_VENDOR_LIBRARY_NAME=nvidia
LIBVA_DRIVER_NAME=nvidia
NVD_BACKEND=direct
VDPAU_DRIVER=nvidia
WLR_NO_HARDWARE_CURSORS=1

# --- Sessão Wayland ----------------------------------------------------------
XDG_SESSION_TYPE=wayland
XDG_CURRENT_DESKTOP=Hyprland
XDG_SESSION_DESKTOP=Hyprland

# --- Toolkits ----------------------------------------------------------------
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=qt6ct
QT_STYLE_OVERRIDE=kvantum
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland
GDK_BACKEND=wayland,x11
EGL_PLATFORM=wayland
ELECTRON_OZONE_PLATFORM_HINT=wayland
OZONE_PLATFORM=wayland

# --- Firefox / Gecko ---------------------------------------------------------
MOZ_ENABLE_WAYLAND=1
MOZ_USE_XINPUT2=1
MOZ_ACCELERATED=1
MOZ_DISABLE_RDD_SANDBOX=1

# --- Padrões & tema ----------------------------------------------------------
EDITOR=nvim
VISUAL=nvim
TERMINAL=ghostty
TERM=xterm-ghostty
BROWSER=firefox
FILE_MANAGER=dolphin
VIDEO_PLAYER=mpv
IMAGE_VIEWER=imv
XCURSOR_THEME=catppuccin-latte-light-cursors
XCURSOR_SIZE=24

# --- Editores / debug --------------------------------------------------------
MICRO_TRUECOLOR=1
MICRO_CLIPBOARD=external
DEBUGINFOD_URLS=https://debuginfod.archlinux.org
# acompanha a versão do python (origem: /etc/profile.d/vapoursynth.sh)
VSSCRIPT_PATH=/usr/lib/python3.14/site-packages/vapoursynth/libvsscript.so
